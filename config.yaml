# Daily job scraper config.
# window_hours: how far back to keep jobs (the workflow can override with --hours).
window_hours: 24

profiles:
  # Nagaraju: loose title filter only. Stack, experience (1-5 yrs), 500+ size,
  # product-company and pay checks are done by the Claude scheduled task.
  nagaraju:
    title_include:
      - 'software (engineer|developer|development engineer)'
      - '\bSDE\b|\bSWE\b|member of technical staff|\bMTS\b'
      - 'full[ -]?stack|back[ -]?end|front[ -]?end|node|typescript|react|next\.?js|web (engineer|developer)'
      - 'tech(nical)? lead|lead (software|engineer)|engineering lead'
    title_exclude:
      - '\bjava\b|\.net|\bc#|golang|\bgo\b developer|ruby|php|salesforce|\bsap\b|servicenow developer'
      - '\bQA\b|test|SDET|quality'
      - 'data (engineer|scien)|machine learning|\bML\b|android|\bios\b|mobile|embedded|firmware'
      - 'intern|trainee|graduate|fresher|principal|director|\bvp\b|head of|architect|manager'
      - 'support engineer|devops|\bSRE\b|site reliability|security engineer|network'
    location_regex: 'india|bengaluru|bangalore|hyderabad|pune|chennai|mumbai|gurgaon|gurugram|noida|delhi|remote|anywhere'
    board_terms:
      - 'senior software engineer node.js typescript'
      - 'full stack engineer react node'
      - 'backend engineer nestjs'
      - 'SDE 2 full stack'
      - 'tech lead node.js react'

  # Jhansi: QA automation roles.
  jhansi:
    title_include:
      - '\bQA\b|quality (assurance|engineer)|\bSDET\b|test(ing)? (automation|engineer)|automation (test|engineer)|software (development )?engineer in test'
    title_exclude:
      - 'manager|director|principal|\blead\b|architect|intern|trainee'
      - 'manual tester only|hardware|validation engineer'
    location_regex: 'india|bengaluru|bangalore|hyderabad|pune|chennai|mumbai|gurgaon|gurugram|noida|delhi|remote|anywhere'
    board_terms:
      - 'QA automation engineer selenium java'
      - 'SDET'
      - 'automation test engineer cypress playwright'

# LinkedIn / Naukri / Google Jobs via JobSpy, for companies not listed below.
boards:
  enabled: true
  sites: [linkedin, naukri, google]
  location: 'Bengaluru, Karnataka, India'
  results_per_term: 40

# Company career sites. ats: greenhouse | lever | ashby | smartrecruiters | workday
# token = the company's board name on that ATS; workday uses the careers-site url.
# STARTER LIST - every entry is checked on the first GitHub run (--validate) and
# fixed or replaced; it then grows from the companies in past trackers.
